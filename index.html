  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .phone-slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
}
    .phone-slide.active { opacity: 1; }

    .phone-slide-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.2) 100%);

    .testimonials-section { padding: 8rem 1.5rem; background: #fff; }
    .section-inner { max-width: 80rem; margin: 0 auto; }

    .vtc-main {
      flex: 1; position: relative; aspect-ratio: 16/9;
      background: #0a0a0a; border-radius: 1.75rem; overflow: hidden;
      box-shadow: 0 32px 64px -12px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.08);

    .vtc-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 0.65s ease; }
    .vtc-slide.active { opacity: 1; }
    .vtc-overlay {
      position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.08) 55%, transparent 100%);
      pointer-events: none;
    }
    .vtc-info { position: absolute; bottom: 1.75rem; left: 1.75rem; right: 1.75rem; z-index: 4; color: #fff; display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
    .vtc-name { font-weight: 700; font-size: 1.125rem; letter-spacing: -0.01em; line-height: 1.2; }

    .vtc-stars { display: flex; gap: 0.2rem; margin-bottom: 0.35rem; }
    .vtc-arrow {

      .vtc-thumb { width: 5.5rem; border-radius: 0.625rem; }
      .vtc-thumb-label { font-size: 0.45rem; }
      .vtc-thumb-num { font-size: 0.45rem; }

      .vtc-arrow-row .vtc-arrow { display: flex !important; width: 2.75rem; height: 2.75rem; }
    }
    .vtc-thumbs { margin-top: 1.5rem; display: flex; gap: 0.875rem; justify-content: center; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; }
    .vtc-thumbs::-webkit-scrollbar { display: none; }
    .vtc-thumb { flex-shrink: 0; width: 7.5rem; aspect-ratio: 16/9; border-radius: 0.875rem; overflow: hidden; cursor: pointer; position: relative; border: 2px solid transparent; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: all 0.3s ease; background: #0a0a0a; }

    .vtc-thumb.active .vtc-thumb-overlay { background: rgba(0,0,0,0.15); }
    .vtc-thumb-label { position: absolute; bottom: 0.35rem; left: 0.4rem; right: 0.4rem; color: #fff; font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vtc-thumb-num { position: absolute; top: 0.35rem; left: 0.4rem; font-size: 0.5rem; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.1em; }

    .why-channels-section { padding: 8rem 1.5rem; background: var(--color-brand-dark); position: relative; overflow: hidden; }

"https://i.ibb.co/5xgr7vZm/x.jpg?w=640&h=1200&fit=crop&q=80",
     "https://i.ibb.co/0phRmQ6k/x.jpg?w=640&h=1200&fit=crop&q=80",

   ];
